<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
  .stage { width: 1200px; height: 190px; background: #0b0c10; }
  .row { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .cell { flex: 1; text-align: center; }
  .cell + .cell { border-left: 1px solid rgba(255,255,255,0.08); }
  .num { font-size: 44px; font-weight: 900; letter-spacing: -0.5px; }
  .lab { margin-top: 6px; font-size: 16.5px; font-weight: 600; color: #8b92a0; }
  .c1 { color: #34d399; } .c2 { color: #a78bfa; } .c3 { color: #22d3ee; } .c4 { color: #f59e0b; }
</style></head><body>
<div class="stage">
  <div class="row">
    <div class="cell"><div class="num c1">7 Days</div><div class="lab">Free Trial</div></div>
    <div class="cell"><div class="num c2">AI</div><div class="lab">Price Targets</div></div>
    <div class="cell"><div class="num c3">Live</div><div class="lab">Market Signals</div></div>
    <div class="cell"><div class="num c4">$9.99</div><div class="lab">Founder's Pricing</div></div>
  </div>
</div>
</body></html>
